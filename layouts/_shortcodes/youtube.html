{{- $id := .Get "id" | default (.Get 0) -}}
{{- $title := .Get "title" | default "YouTube Video" -}}
{{- $poster := printf "https://img.youtube.com/vi/%s/hqdefault.jpg" $id -}}
<div class="youtube-lazy" data-video-id="{{ $id }}" data-title="{{ $title }}">
  <img src="{{ $poster }}" alt="{{ $title }}" loading="lazy" width="480" height="360" />
  <div class="youtube-lazy-play">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.youtube-lazy').forEach(function(el) {
    el.addEventListener('click', function() {
      var iframe = document.createElement('iframe');
      iframe.setAttribute('src', 'https://www.youtube-nocookie.com/embed/' + this.dataset.videoId + '?autoplay=1');
      iframe.setAttribute('frameborder', '0');
      iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
      iframe.setAttribute('allowfullscreen', '');
      iframe.setAttribute('title', this.dataset.title);
      iframe.style.position = 'absolute';
      iframe.style.top = '0';
      iframe.style.left = '0';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      this.innerHTML = '';
      this.appendChild(iframe);
    });
  });
});
</script>
