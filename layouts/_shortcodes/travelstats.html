{{- /*
    travelstats.html — static stats table for the homepage.
    Replaces the prior Odometer+CSS+jQuery block with server-rendered HTML.
*/ -}}
<table class="center">
  <thead class="visually-hidden">
    <tr>
      <th scope="col">Countries</th>
      <th scope="col">Flights</th>
      <th scope="col">Beds</th>
      <th scope="col">Airports</th>
      <th scope="col">Buses</th>
      <th scope="col">Motorbikes</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><div class="odometer">19</div></td>
      <th scope="row">Countries</th>
      <td><div class="odometer">136</div></td>
      <th scope="row">Flights</th>
    </tr>
    <tr>
      <td><div class="odometer">258</div></td>
      <th scope="row">Beds</th>
      <td><div class="odometer">42</div></td>
      <th scope="row">Airports</th>
    </tr>
    <tr>
      <td><div class="odometer">43</div></td>
      <th scope="row">Buses</th>
      <td><div class="odometer">20</div></td>
      <th scope="row">Motorbikes</th>
    </tr>
  </tbody>
</table>
