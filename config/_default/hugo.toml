baseURL = "https://carryonrtw.com"
locale = "en-us"
title = "Carry On Round The World"
theme = ["github.com/gohugo-ananke/ananke/v2"]

DefaultContentLanguage = "en"
SectionPagesMenu = "main"
pagination.pagerSize = 9
googleAnalytics = "G-QT3G9GJDXC"
enableRobotsTXT = true
enableEmoji = true
summaryLength = 50

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[markup.goldmark.renderer]
  unsafe= true

[params.ananke]
custom_css = ["custom.css", "formatted_tables.css", "next_prev_links.css"]

[params.ananke.pages]
  show_list_images =true
  show_date = true

[params]
  # Mirror of the top-level summaryLength above: Hugo 0.165 templates cannot read
  # top-level config keys, and layouts/_partials/page-summary.html reads this one.
  # Keep both in sync.
  summaryLength = 50
  favicon = "/images/favicon.ico"
  # site_logo = "/images/cropped-rtw_icon-512x512.png"
  site_logo = "images/rtw_icon.svg"
  description = "Carry On luggage only travels and adventures around the world with Canadians Paul and Helen Rimmer"
  # choose a background color from any on this page: http://tachyons.io/docs/themes/skins/ and preface it with "bg-"
  background_color_class = "bg-dark-gray"
  post_content_classes = "arial"
  featured_image = "images/content__indexq20.webp"
  # featured_image = "https://lh3.googleusercontent.com/pw/AP1GczNK-hUAHzp7hlqLBpjBWCRRO3N4vdQTFoVJFEWKkWYoXBTGq7-f1JJANeJ-_ZabLrInWYnIHoG48XhxSJpOLzVGf-7_Bc6wRXh_lGrVJ3tU68m3192hA6v6HePnvmjlkuPb-uaBWJ328qqcuNyXf83gVQ=w1573-h887-s-no?authuser=0"
  featured_image_class = "cover bg-center"
  show_nav_menu = true
  show_author_reading_data = true
  recent_posts_number = 5
  show_reading_time = true
  commentoEnable = false
  mainSections = ["travels", "packs", "articles", "van-life"]

[params.giscus]
  enable = true
  repo = "RoninTech/CarryOnRoundTheWorld"
  repoId = "R_kgDOHchbBw"
  category = "Comment"
  categoryId = "DIC_kwDOHchbB84CQRzz"
  mapping = "og:title"
  reactionsEnabled = 1
  emitMetadata = 0
  inputPosition = "top"
  theme = "light"
  lang = "en"
  loading = "lazy"

[menu]
  [[menu.main]]
    name = "Travels"
    identifier = "travels"
    pageRef= "/travels"
    weight = 2

  [[menu.main]]
    name = "Packs"
    identifier = "packs"
    pageRef= "/packs"
    weight = 3

  [[menu.main]]
    name = "Articles"
    identifier = "articles"
    pageRef= "/articles"
    weight = 4

  [[menu.main]]
    name = "Van Life"
    identifier = "van-life"
    pageRef= "/van-life"
    weight = 5

  [[menu.main]]
    name = "About Us"
    identifier = "about"
    pageRef= "/about"
    weight = 6

[module]
[[module.imports]]
    path = 'github.com/gohugo-ananke/ananke/v2'
    disable = false
